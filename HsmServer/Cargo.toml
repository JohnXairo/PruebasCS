[package]
name = "hsmserver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hsmserver"
path = "src/main.rs"

[dependencies]
# Framework HTTP async
actix-web = "4"
# Serializacion JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# UUID para identificadores de operacion
uuid = { version = "1", features = ["v4"] }
# Timestamps
chrono = { version = "0.4", features = ["serde"] }
# Logging
env_logger = "0.11"
log = "0.4"
# Generador de bytes aleatorios (simula operaciones HSM)
rand = "0.8"
# Codificacion base64 (simula claves/firmas)
base64 = "0.22"
# Instana tracing (OpenTelemetry)
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "reqwest-client"] }
opentelemetry-semantic-conventions = "0.27"
tracing = "0.1"
tracing-opentelemetry = "0.28"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
