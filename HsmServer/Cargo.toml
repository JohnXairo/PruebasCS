[package]
name = "hsmserver"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hsmserver"
path = "src/main.rs"

[dependencies]
actix-web   = "4"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
uuid        = { version = "1", features = ["v4"] }
chrono      = { version = "0.4", features = ["serde"] }
env_logger  = "0.11"
log         = "0.4"
rand        = "0.8"
base64      = "0.22"
tokio       = { version = "1", features = ["time", "rt-multi-thread", "macros"] }
# Soporte nativo Windows Service
windows-service = "0.7"
