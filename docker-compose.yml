version: '3.8'

services:

  orderservice:
    build:
      context: ./OrderService
      dockerfile: Dockerfile
    container_name: orderservice
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - Services__InventoryService=http://inventoryservice:8081
      - Services__NotificationService=http://notificationservice:8082
      # --- Instana: descomentar al instrumentar ---
      # - CORECLR_ENABLE_PROFILING=1
      # - CORECLR_PROFILER={cf0d821e-299b-5307-a3d8-b283c03916dd}
      # - CORECLR_PROFILER_PATH=/opt/instana/instrumentation/profiler/linux-x64/libinstanacoreprofilr.so
      # - INSTANA_AGENT_HOST=host.docker.internal
      # - INSTANA_AGENT_PORT=42699
    networks:
      - lab-net
    depends_on:
      - inventoryservice
      - notificationservice

  inventoryservice:
    build:
      context: ./InventoryService
      dockerfile: Dockerfile
    container_name: inventoryservice
    ports:
      - "8081:8081"
    environment:
      - ASPNETCORE_URLS=http://+:8081
      # --- Instana: descomentar al instrumentar ---
      # - CORECLR_ENABLE_PROFILING=1
      # - CORECLR_PROFILER={cf0d821e-299b-5307-a3d8-b283c03916dd}
      # - CORECLR_PROFILER_PATH=/opt/instana/instrumentation/profiler/linux-x64/libinstanacoreprofilr.so
      # - INSTANA_AGENT_HOST=host.docker.internal
      # - INSTANA_AGENT_PORT=42699
    networks:
      - lab-net

  notificationservice:
    build:
      context: ./NotificationService
      dockerfile: Dockerfile
    container_name: notificationservice
    ports:
      - "8082:8082"
    environment:
      - ASPNETCORE_URLS=http://+:8082
      # --- Instana: descomentar al instrumentar ---
      # - CORECLR_ENABLE_PROFILING=1
      # - CORECLR_PROFILER={cf0d821e-299b-5307-a3d8-b283c03916dd}
      # - CORECLR_PROFILER_PATH=/opt/instana/instrumentation/profiler/linux-x64/libinstanacoreprofilr.so
      # - INSTANA_AGENT_HOST=host.docker.internal
      # - INSTANA_AGENT_PORT=42699
    networks:
      - lab-net

networks:
  lab-net:
    driver: bridge
